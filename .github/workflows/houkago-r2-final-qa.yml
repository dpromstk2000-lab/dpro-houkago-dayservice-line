name: HOUKAGO R2 Final QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/houkago-r2-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify current R2 backend gate
        id: api_gate
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY'
          import json, urllib.request, pathlib

          url = "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/houkago-product-ready-adapter/api/product-ready/check"
          result = {"status": "FAIL", "errors": []}
          try:
              with urllib.request.urlopen(url, timeout=45) as r:
                  data = json.loads(r.read().decode("utf-8"))
              checks = data.get("checks") or {}
              ok = (
                  r.status == 200
                  and data.get("ok") is True
                  and (data.get("result") or {}).get("all_passed") is True
                  and len(checks) == 13
                  and all(v is True for v in checks.values())
              )
              result.update({
                  "http_status": r.status,
                  "passed": (data.get("result") or {}).get("passed"),
                  "total": (data.get("result") or {}).get("total"),
                  "all_passed": (data.get("result") or {}).get("all_passed"),
                  "frontend_version": data.get("frontend_version"),
                  "status": "PASS" if ok else "FAIL",
              })
              if not ok:
                  result["errors"].append("product_ready_check_not_13_of_13")
          except Exception as e:
              result["errors"].append(repr(e))

          pathlib.Path("/tmp/houkago_api_gate.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Install Playwright Chromium
        id: browser_setup
        continue-on-error: true
        shell: bash
        run: |
          echo "workspace=$GITHUB_WORKSPACE"
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          test -d "$GITHUB_WORKSPACE/node_modules/playwright"
          echo "PLAYWRIGHT_NODE_MODULE=$GITHUB_WORKSPACE/node_modules/playwright"

      - name: Fresh Chromium public QA
        id: browser_qa
        continue-on-error: true
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          echo "NODE_PATH=$NODE_PATH"
          node -e "console.log('playwright resolved:', require.resolve('playwright'))"

          cat > /tmp/houkago_browser_qa.js <<'JS'
          const fs = require("fs");
          const { chromium } = require("playwright");

          const VERSION = "HOUKAGO-4-R2-PRODUCT-READY-20260824";
          const BASE = "https://dpromstk2000-lab.github.io/dpro-houkago-dayservice-line/";
          const stamp = Date.now().toString();

          const techTerms = [
            "Supabase",
            "SERVICE_ROLE",
            "service_role",
            "PostgreSQL",
            "database_version",
            "adapter_version",
            "staff_authority",
            "x-admin-code",
            "JWT",
            " RLS "
          ];

          const cases = [
            {
              key: "pc_1440",
              url: BASE + "owner.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 1440, height: 1000, customer: false
            },
            {
              key: "mobile_390",
              url: BASE + "member.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 390, height: 844, customer: true
            },
            {
              key: "mobile_320",
              url: BASE + "index.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 320, height: 700, customer: true
            },
            {
              key: "ipad_1024",
              url: BASE + "owner-ipad.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 1024, height: 768, customer: false
            },
            {
              key: "support_program",
              url: BASE + "support-program.html?v=" + VERSION + "&r2qa=" + stamp,
              width: 390, height: 844, customer: true
            }
          ];

          function save(out) {
            fs.writeFileSync(
              "/tmp/houkago_browser_qa.json",
              JSON.stringify(out, null, 2)
            );
          }

          (async () => {
            const out = {
              status: "FAIL",
              version: VERSION,
              browser_cases: [],
              customer_tech_terms: { status: "PASS", hits: [] },
              system_check: {},
              official_product_site: {},
              errors: []
            };

            let browser;
            try {
              browser = await chromium.launch({ headless: true });
            } catch (e) {
              out.errors.push("chromium_launch:" + String(e));
              save(out);
              console.error(JSON.stringify(out, null, 2));
              process.exit(1);
            }

            try {
              for (const tc of cases) {
                const context = await browser.newContext({
                  viewport: { width: tc.width, height: tc.height },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();
                const pageErrors = [];
                const failedRequests = [];

                page.on("pageerror", e => pageErrors.push(String(e)));
                page.on("requestfailed", req => {
                  const f = req.failure();
                  failedRequests.push({
                    url: req.url(),
                    error: f ? f.errorText : "requestfailed"
                  });
                });

                let response = null;
                try {
                  response = await page.goto(tc.url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });
                  await page.waitForTimeout(3000);
                } catch (e) {
                  out.errors.push(tc.key + "_navigation:" + String(e));
                }

                let metrics = {};
                let bodyText = "";
                try {
                  metrics = await page.evaluate(() => ({
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth,
                    scrollHeight: document.documentElement.scrollHeight,
                    clientHeight: document.documentElement.clientHeight,
                    bodyLength: (document.body?.innerText || "").trim().length,
                    title: document.title || "",
                    readyState: document.readyState
                  }));
                  bodyText = await page.locator("body").innerText({ timeout: 5000 });
                } catch (e) {
                  out.errors.push(tc.key + "_dom:" + String(e));
                }

                const techHits = [];
                if (tc.customer && bodyText) {
                  for (const term of techTerms) {
                    if (bodyText.includes(term)) {
                      techHits.push(term);
                      out.customer_tech_terms.hits.push({ page: tc.key, term });
                    }
                  }
                }

                const httpStatus = response ? response.status() : 0;
                const httpOk = httpStatus >= 200 && httpStatus < 400;
                const overflowOk =
                  Number(metrics.scrollWidth || 0) <=
                  Number(metrics.clientWidth || 0) + 1;
                const visibleOk = Number(metrics.bodyLength || 0) >= 100;
                const pageErrorOk = pageErrors.length === 0;
                const pass = httpOk && overflowOk && visibleOk && pageErrorOk;

                out.browser_cases.push({
                  key: tc.key,
                  viewport: { width: tc.width, height: tc.height },
                  http_status: httpStatus,
                  title: metrics.title || "",
                  ready_state: metrics.readyState || "",
                  scroll_width: metrics.scrollWidth || 0,
                  client_width: metrics.clientWidth || 0,
                  body_length: metrics.bodyLength || 0,
                  horizontal_overflow_ok: overflowOk,
                  visible_content_ok: visibleOk,
                  page_errors: pageErrors,
                  failed_requests: failedRequests.slice(0, 20),
                  customer_tech_hits: techHits,
                  status: pass ? "PASS" : "FAIL"
                });

                try {
                  await page.screenshot({
                    path: "/tmp/" + tc.key + ".png",
                    fullPage: true
                  });
                } catch {}

                if (!pass) out.errors.push(tc.key + "_render_not_pass");
                await context.close();
              }

              if (out.customer_tech_terms.hits.length > 0) {
                out.customer_tech_terms.status = "FAIL";
                out.errors.push("customer_technical_terms_exposed");
              }

              // system-check: 14/14 + public URL 7/7
              {
                const context = await browser.newContext({
                  viewport: { width: 1440, height: 1000 },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();
                const errors = [];
                page.on("pageerror", e => errors.push(String(e)));

                const url =
                  BASE + "system-check.html?demo=1&v=" + VERSION +
                  "&r2qa=" + stamp;

                let response = null;
                try {
                  response = await page.goto(url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });

                  await page.waitForFunction(
                    () => {
                      const b = document.getElementById("runAllButton");
                      return b && !b.disabled;
                    },
                    null,
                    { timeout: 60000 }
                  );

                  await page.locator("#runAllButton").click();

                  await page.waitForFunction(
                    () => {
                      const b = document.getElementById("runAllButton");
                      const auto = document.getElementById("automaticOverallStatus");
                      const pages = document.getElementById("pageStatus");
                      return (
                        b &&
                        !b.disabled &&
                        auto &&
                        /14\s*\/\s*14/.test(auto.innerText || "") &&
                        pages &&
                        /全画面公開OK/.test(pages.innerText || "")
                      );
                    },
                    null,
                    { timeout: 150000 }
                  );

                  await page.waitForTimeout(1500);
                } catch (e) {
                  errors.push("interaction:" + String(e));
                }

                const data = await page.evaluate(() => {
                  const text = id =>
                    document.getElementById(id)?.innerText?.trim() || "";
                  return {
                    automatic: text("automaticOverallStatus"),
                    pages: text("pageStatus"),
                    overall_title: text("overallTitle"),
                    overall_message: text("overallMessage"),
                    step_title: text("stepResultTitle"),
                    admin_status: text("adminCodeStatus"),
                    scroll_width: document.documentElement.scrollWidth,
                    client_width: document.documentElement.clientWidth
                  };
                }).catch(e => ({ eval_error: String(e) }));

                const httpStatus = response ? response.status() : 0;
                const pass =
                  httpStatus >= 200 &&
                  httpStatus < 400 &&
                  /14\s*\/\s*14/.test(data.automatic || "") &&
                  /全画面公開OK/.test(data.pages || "") &&
                  /システム完成・営業デモ可能です/.test(data.overall_title || "") &&
                  Number(data.scroll_width || 0) <=
                    Number(data.client_width || 0) + 1 &&
                  errors.length === 0;

                out.system_check = {
                  http_status: httpStatus,
                  ...data,
                  errors,
                  status: pass ? "PASS" : "FAIL"
                };

                try {
                  await page.screenshot({
                    path: "/tmp/system_check_1440.png",
                    fullPage: true
                  });
                } catch {}

                if (!pass) out.errors.push("system_check_not_pass");
                await context.close();
              }

              // Official DPRO SHOP must serve exactly 13 R2 markers, zero R7 markers.
              {
                const context = await browser.newContext({
                  viewport: { width: 390, height: 844 },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();

                const url =
                  "https://dpro-shop.com/systems/houkago-dayservice?r2qa=" +
                  stamp;

                let response = null;
                let html = "";
                let navigationError = "";

                try {
                  response = await page.goto(url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });
                  await page.waitForTimeout(2000);
                  html = await page.content();
                } catch (e) {
                  navigationError = String(e);
                }

                const old =
                  "HOUKAGO-4-R7-FINAL-INTEGRATION-20260717";
                const r2Count = html.split(VERSION).length - 1;
                const oldCount = html.split(old).length - 1;

                const metric = await page.evaluate(() => ({
                  sw: document.documentElement.scrollWidth,
                  cw: document.documentElement.clientWidth
                })).catch(() => ({ sw: 0, cw: 0 }));

                const httpStatus = response ? response.status() : 0;
                const pass =
                  httpStatus >= 200 &&
                  httpStatus < 400 &&
                  r2Count === 13 &&
                  oldCount === 0 &&
                  metric.sw <= metric.cw + 1;

                out.official_product_site = {
                  http_status: httpStatus,
                  r2_marker_count: r2Count,
                  old_r7_marker_count: oldCount,
                  horizontal_overflow_ok: metric.sw <= metric.cw + 1,
                  navigation_error: navigationError,
                  status: pass ? "PASS" : "FAIL"
                };

                try {
                  await page.screenshot({
                    path: "/tmp/official_product_390.png",
                    fullPage: true
                  });
                } catch {}

                if (!pass) out.errors.push("official_product_site_not_pass");
                await context.close();
              }

            } finally {
              await browser.close();
            }

            out.status = out.errors.length === 0 ? "PASS" : "FAIL";
            save(out);
            console.log(JSON.stringify(out, null, 2));

            if (out.status !== "PASS") process.exit(1);
          })().catch(e => {
            const out = {
              status: "FAIL",
              errors: ["unhandled:" + String(e)]
            };
            save(out);
            console.error(JSON.stringify(out, null, 2));
            process.exit(1);
          });
          JS

          node /tmp/houkago_browser_qa.js

      - name: Build QA commit evidence
        if: always()
        shell: bash
        run: |
          python <<'PY'
          import json, pathlib

          def read(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception as e:
                  return {"status": "FAIL", "errors": [repr(e)]}

          api = read("/tmp/houkago_api_gate.json")
          browser = read("/tmp/houkago_browser_qa.json")

          cases = {
              x.get("key"): x
              for x in (browser.get("browser_cases") or [])
          }
          tech = browser.get("customer_tech_terms") or {}
          system = browser.get("system_check") or {}
          official = browser.get("official_product_site") or {}

          errors = []
          errors += api.get("errors") or []
          errors += browser.get("errors") or []

          overall = (
              "PASS"
              if api.get("status") == "PASS"
              and browser.get("status") == "PASS"
              and not errors
              else "FAIL"
          )

          subject = (
              f"HOUKAGO R2 FINAL BROWSER QA {overall} "
              f"[API_GATE={api.get('status')} BROWSER={browser.get('status')}]"
          )

          lines = [
              subject,
              "",
              "PRODUCT=DPRO PRODUCT READY #35 HOUKAGO",
              "AUDIT_SEQUENCE=2",
              "BACKEND_SELF_TEST_EVIDENCE_COMMIT=439660423aa504c7c70e9cc309410c35135d86a7",
              (
                  "API_GATE="
                  f"{api.get('passed')}/{api.get('total')} "
                  f"all_passed={api.get('all_passed')} "
                  f"frontend={api.get('frontend_version')}"
              ),
              f"PC_1440={cases.get('pc_1440',{}).get('status')} overflow_ok={cases.get('pc_1440',{}).get('horizontal_overflow_ok')}",
              f"MOBILE_390={cases.get('mobile_390',{}).get('status')} overflow_ok={cases.get('mobile_390',{}).get('horizontal_overflow_ok')}",
              f"MOBILE_320={cases.get('mobile_320',{}).get('status')} overflow_ok={cases.get('mobile_320',{}).get('horizontal_overflow_ok')}",
              f"IPAD_1024={cases.get('ipad_1024',{}).get('status')} overflow_ok={cases.get('ipad_1024',{}).get('horizontal_overflow_ok')}",
              f"SUPPORT_PROGRAM={cases.get('support_program',{}).get('status')}",
              f"CUSTOMER_TECH_TERMS={tech.get('status')} hits={len(tech.get('hits') or [])}",
              (
                  "SYSTEM_CHECK="
                  f"{system.get('status')} "
                  f"auto={system.get('automatic')} "
                  f"pages={system.get('pages')} "
                  f"overall={system.get('overall_title')}"
              ),
              (
                  "OFFICIAL_PRODUCT_SITE="
                  f"{official.get('status')} "
                  f"r2_markers={official.get('r2_marker_count')} "
                  f"old_r7_markers={official.get('old_r7_marker_count')} "
                  f"overflow_ok={official.get('horizontal_overflow_ok')}"
              ),
              f"ERROR_COUNT={len(errors)}",
          ]

          if errors:
              lines.append(
                  "ERRORS=" +
                  " | ".join(str(x) for x in errors)[:6000]
              )

          pathlib.Path("/tmp/houkago_final_status.txt").write_text(
              overall, encoding="utf-8"
          )
          pathlib.Path("/tmp/houkago_commit_message.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          print("\n".join(lines))
          PY

      - name: Self-remove QA workflow and commit evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch .github/workflows/houkago-r2-final-qa.yml
          git add -A

          if git diff --cached --quiet; then
            echo "No staged repository changes."
          else
            git commit -F /tmp/houkago_commit_message.txt
            git push origin main
          fi

      - name: Final browser QA gate
        if: always()
        shell: bash
        run: |
          status="$(cat /tmp/houkago_final_status.txt 2>/dev/null || echo FAIL)"
          echo "FINAL_BROWSER_QA_STATUS=$status"
          test "$status" = "PASS"
