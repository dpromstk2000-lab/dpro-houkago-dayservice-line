name: HOUKAGO R2 Final QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/houkago-r2-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Live API and self-test QA
        id: apiqa
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY'
          import json, urllib.request, urllib.error, datetime, pathlib

          base = "https://cbknucemarcpbscirzyv.supabase.co/functions/v1/houkago-product-ready-adapter"
          result = {
              "status": "FAIL",
              "frontend_version": None,
              "health": {},
              "product_ready_check": {},
              "self_test": {},
              "errors": [],
          }

          def request_json(url, method="GET", headers=None, body=None, timeout=45):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers=headers or {},
                  data=body,
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  raw = response.read().decode("utf-8")
                  return response.status, json.loads(raw)

          try:
              status, health = request_json(base + "/api/health")
              result["health"] = health
              result["frontend_version"] = health.get("frontend_version")
              if status != 200 or health.get("ok") is not True:
                  result["errors"].append("health_not_ok")
          except Exception as e:
              result["errors"].append("health:" + repr(e))

          try:
              status, check = request_json(base + "/api/product-ready/check")
              result["product_ready_check"] = check
              checks = check.get("checks") or {}
              if (
                  status != 200
                  or check.get("ok") is not True
                  or (check.get("result") or {}).get("all_passed") is not True
                  or len(checks) != 13
                  or not all(v is True for v in checks.values())
              ):
                  result["errors"].append("product_ready_check_not_13_of_13")
          except Exception as e:
              result["errors"].append("product_ready_check:" + repr(e))

          try:
              status, self_test = request_json(
                  base + "/api/product-ready/self-test",
                  method="POST",
                  headers={
                      "content-type": "application/json",
                      "x-admin-code": "1234",
                  },
                  body=b"{}",
                  timeout=90,
              )
              result["self_test"] = self_test
              demo = self_test.get("demo_prepare") or {}
              photo = self_test.get("photo") or {}
              staff = self_test.get("staff") or {}
              if status != 200 or self_test.get("ok") is not True:
                  result["errors"].append("self_test_not_ok")
              if demo.get("ok") is not True:
                  result["errors"].append("demo_prepare_not_ok")
              demo_checks = demo.get("checks") or {}
              for key in ("first", "second", "repeat_safe", "production_untouched"):
                  if demo_checks.get(key) is not True:
                      result["errors"].append("demo_prepare_" + key + "_not_ok")
              if photo.get("ok") is not True:
                  result["errors"].append("photo_privacy_not_ok")
              photo_checks = photo.get("checks") or {}
              for key in (
                  "guardian_linked_child",
                  "guardian_cross_child_denied",
                  "cross_tenant_child_denied",
                  "private_bucket",
                  "session_revoke_blocks_new_signing",
              ):
                  if photo_checks.get(key) is not True:
                      result["errors"].append("photo_" + key + "_not_ok")
              if photo_checks.get("signed_read_expiry_seconds") != 60:
                  result["errors"].append("photo_signed_read_expiry_not_60")
              if photo_checks.get("signed_upload_expiry_seconds") != 7200:
                  result["errors"].append("photo_signed_upload_expiry_not_7200")
              if staff.get("ok") is not True:
                  result["errors"].append("staff_self_test_not_ok")
          except Exception as e:
              result["errors"].append("self_test:" + repr(e))

          result["status"] = "PASS" if not result["errors"] else "FAIL"
          pathlib.Path("/tmp/houkago_api_qa.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          pathlib.Path("/tmp/houkago_api_status.txt").write_text(
              result["status"], encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Install Playwright Chromium
        id: browser_setup
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Fresh Chromium public QA
        id: browserqa
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/houkago_browser_qa.js <<'JS'
          const fs = require("fs");
          let chromium;
          try {
            ({ chromium } = require("playwright"));
          } catch (e) {
            const fail = { status: "FAIL", errors: ["playwright_not_available:" + String(e)] };
            fs.writeFileSync("/tmp/houkago_browser_qa.json", JSON.stringify(fail, null, 2));
            fs.writeFileSync("/tmp/houkago_browser_status.txt", "FAIL");
            console.error(fail);
            process.exit(1);
          }

          const VERSION = "HOUKAGO-4-R2-PRODUCT-READY-20260824";
          const BASE = "https://dpromstk2000-lab.github.io/dpro-houkago-dayservice-line/";
          const stamp = Date.now().toString();
          const techTerms = [
            "Supabase",
            "SERVICE_ROLE",
            "service_role",
            "PostgreSQL",
            "database_version",
            "adapter_version",
            "staff_authority",
            "x-admin-code",
            "JWT",
            " RLS "
          ];

          const cases = [
            {
              key: "pc_1440",
              url: BASE + "owner.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 1440, height: 1000, customer: false
            },
            {
              key: "mobile_390",
              url: BASE + "member.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 390, height: 844, customer: true
            },
            {
              key: "mobile_320",
              url: BASE + "index.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 320, height: 700, customer: true
            },
            {
              key: "ipad_1024",
              url: BASE + "owner-ipad.html?demo=1&v=" + VERSION + "&r2qa=" + stamp,
              width: 1024, height: 768, customer: false
            },
            {
              key: "support_program",
              url: BASE + "support-program.html?v=" + VERSION + "&r2qa=" + stamp,
              width: 390, height: 844, customer: true
            }
          ];

          function safeName(x) {
            return x.replace(/[^a-zA-Z0-9_-]+/g, "_");
          }

          (async () => {
            const out = {
              status: "FAIL",
              version: VERSION,
              browser_cases: [],
              customer_tech_terms: { status: "PASS", hits: [] },
              system_check: {},
              official_product_site: {},
              errors: []
            };

            let browser;
            try {
              browser = await chromium.launch({ headless: true });
            } catch (e) {
              out.errors.push("chromium_launch:" + String(e));
              fs.writeFileSync("/tmp/houkago_browser_qa.json", JSON.stringify(out, null, 2));
              fs.writeFileSync("/tmp/houkago_browser_status.txt", "FAIL");
              console.error(out);
              process.exit(1);
            }

            try {
              for (const tc of cases) {
                const context = await browser.newContext({
                  viewport: { width: tc.width, height: tc.height },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();
                const pageErrors = [];
                const failedRequests = [];
                page.on("pageerror", e => pageErrors.push(String(e)));
                page.on("requestfailed", req => {
                  const failure = req.failure();
                  failedRequests.push({
                    url: req.url(),
                    error: failure ? failure.errorText : "requestfailed"
                  });
                });

                let response = null;
                try {
                  response = await page.goto(tc.url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });
                  await page.waitForTimeout(2500);
                } catch (e) {
                  out.errors.push(tc.key + "_navigation:" + String(e));
                }

                let metrics = {};
                let bodyText = "";
                try {
                  metrics = await page.evaluate(() => ({
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth,
                    scrollHeight: document.documentElement.scrollHeight,
                    clientHeight: document.documentElement.clientHeight,
                    bodyLength: (document.body?.innerText || "").trim().length,
                    title: document.title || "",
                    readyState: document.readyState
                  }));
                  bodyText = await page.locator("body").innerText({ timeout: 5000 });
                } catch (e) {
                  out.errors.push(tc.key + "_dom:" + String(e));
                }

                const techHits = [];
                if (tc.customer && bodyText) {
                  for (const term of techTerms) {
                    if (bodyText.includes(term)) {
                      techHits.push(term);
                      out.customer_tech_terms.hits.push({ page: tc.key, term });
                    }
                  }
                }

                const docStatus = response ? response.status() : 0;
                const overflowOk =
                  Number(metrics.scrollWidth || 0) <= Number(metrics.clientWidth || 0) + 1;
                const visibleOk = Number(metrics.bodyLength || 0) >= 100;
                const pageErrorOk = pageErrors.length === 0;
                const httpOk = docStatus >= 200 && docStatus < 400;
                const passed = httpOk && overflowOk && visibleOk && pageErrorOk;

                const shot = "/tmp/" + safeName(tc.key) + ".png";
                try {
                  await page.screenshot({ path: shot, fullPage: true });
                } catch {}

                out.browser_cases.push({
                  key: tc.key,
                  url: tc.url,
                  viewport: { width: tc.width, height: tc.height },
                  http_status: docStatus,
                  metrics,
                  horizontal_overflow_ok: overflowOk,
                  visible_content_ok: visibleOk,
                  page_errors: pageErrors,
                  failed_requests: failedRequests.slice(0, 20),
                  customer_tech_hits: techHits,
                  status: passed ? "PASS" : "FAIL"
                });

                if (!passed) out.errors.push(tc.key + "_render_not_pass");
                await context.close();
              }

              if (out.customer_tech_terms.hits.length) {
                out.customer_tech_terms.status = "FAIL";
                out.errors.push("customer_technical_terms_exposed");
              }

              // system-check public execution
              {
                const context = await browser.newContext({
                  viewport: { width: 1440, height: 1000 },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();
                const errors = [];
                page.on("pageerror", e => errors.push(String(e)));

                const url = BASE + "system-check.html?demo=1&v=" + VERSION + "&r2qa=" + stamp;
                let response = null;
                try {
                  response = await page.goto(url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });

                  await page.waitForFunction(
                    () => {
                      const b = document.getElementById("runAllButton");
                      return b && !b.disabled;
                    },
                    null,
                    { timeout: 45000 }
                  );

                  await page.locator("#runAllButton").click();

                  await page.waitForFunction(
                    () => {
                      const b = document.getElementById("runAllButton");
                      const overall = document.getElementById("automaticOverallStatus");
                      return b && !b.disabled && overall && /14\s*\/\s*14/.test(overall.innerText || "");
                    },
                    null,
                    { timeout: 120000 }
                  );
                  await page.waitForTimeout(1500);
                } catch (e) {
                  errors.push("system_check_interaction:" + String(e));
                }

                const data = await page.evaluate(() => {
                  const text = id => document.getElementById(id)?.innerText?.trim() || "";
                  return {
                    automatic: text("automaticOverallStatus"),
                    pages: text("pageStatus"),
                    overall_title: text("overallTitle"),
                    overall_message: text("overallMessage"),
                    admin_status: text("adminCodeStatus"),
                    step_title: text("stepResultTitle"),
                    step_message: text("stepResultMessage"),
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth
                  };
                }).catch(() => ({}));

                const systemPass =
                  response &&
                  response.status() >= 200 &&
                  response.status() < 400 &&
                  /14\s*\/\s*14/.test(data.automatic || "") &&
                  /全画面公開OK/.test(data.pages || "") &&
                  /システム完成・営業デモ可能です/.test(data.overall_title || "") &&
                  Number(data.scrollWidth || 0) <= Number(data.clientWidth || 0) + 1 &&
                  errors.length === 0;

                out.system_check = {
                  url,
                  http_status: response ? response.status() : 0,
                  ...data,
                  errors,
                  status: systemPass ? "PASS" : "FAIL"
                };

                try {
                  await page.screenshot({ path: "/tmp/system_check_1440.png", fullPage: true });
                } catch {}

                if (!systemPass) out.errors.push("system_check_not_pass");
                await context.close();
              }

              // Official product page is serving the R2 link marker.
              {
                const context = await browser.newContext({
                  viewport: { width: 390, height: 844 },
                  deviceScaleFactor: 1
                });
                const page = await context.newPage();
                const url = "https://dpro-shop.com/systems/houkago-dayservice?r2qa=" + stamp;
                let response = null;
                let html = "";
                let error = null;
                try {
                  response = await page.goto(url, {
                    waitUntil: "domcontentloaded",
                    timeout: 45000
                  });
                  await page.waitForTimeout(1500);
                  html = await page.content();
                } catch (e) {
                  error = String(e);
                }
                const newCount = html.split(VERSION).length - 1;
                const old = "HOUKAGO-4-R7-FINAL-INTEGRATION-20260717";
                const oldCount = html.split(old).length - 1;
                const overflow = await page.evaluate(() => ({
                  sw: document.documentElement.scrollWidth,
                  cw: document.documentElement.clientWidth
                })).catch(() => ({sw: 0, cw: 0}));
                const pass =
                  response &&
                  response.status() >= 200 &&
                  response.status() < 400 &&
                  newCount === 13 &&
                  oldCount === 0 &&
                  overflow.sw <= overflow.cw + 1;
                out.official_product_site = {
                  url,
                  http_status: response ? response.status() : 0,
                  r2_marker_count: newCount,
                  old_r7_marker_count: oldCount,
                  horizontal_overflow_ok: overflow.sw <= overflow.cw + 1,
                  navigation_error: error,
                  status: pass ? "PASS" : "FAIL"
                };
                try {
                  await page.screenshot({ path: "/tmp/official_product_390.png", fullPage: true });
                } catch {}
                if (!pass) out.errors.push("official_product_site_not_pass");
                await context.close();
              }

            } finally {
              await browser.close();
            }

            out.status = out.errors.length === 0 ? "PASS" : "FAIL";
            fs.writeFileSync("/tmp/houkago_browser_qa.json", JSON.stringify(out, null, 2));
            fs.writeFileSync("/tmp/houkago_browser_status.txt", out.status);
            console.log(JSON.stringify(out, null, 2));
            if (out.status !== "PASS") process.exit(1);
          })().catch(e => {
            const fail = { status: "FAIL", errors: ["unhandled:" + String(e)] };
            fs.writeFileSync("/tmp/houkago_browser_qa.json", JSON.stringify(fail, null, 2));
            fs.writeFileSync("/tmp/houkago_browser_status.txt", "FAIL");
            console.error(fail);
            process.exit(1);
          });
          JS

          node /tmp/houkago_browser_qa.js

      - name: Build QA commit evidence
        if: always()
        shell: bash
        run: |
          python <<'PY'
          import json, pathlib

          def read_json(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except Exception as e:
                  return {"status": "FAIL", "errors": [f"missing_or_invalid:{path}:{e!r}"]}

          api = read_json("/tmp/houkago_api_qa.json")
          browser = read_json("/tmp/houkago_browser_qa.json")

          errors = []
          errors.extend(api.get("errors") or [])
          errors.extend(browser.get("errors") or [])

          api_ok = api.get("status") == "PASS"
          browser_ok = browser.get("status") == "PASS"
          overall = "PASS" if api_ok and browser_ok and not errors else "FAIL"

          check = api.get("product_ready_check") or {}
          check_result = check.get("result") or {}
          self_test = api.get("self_test") or {}
          demo = self_test.get("demo_prepare") or {}
          demo_checks = demo.get("checks") or {}
          photo = self_test.get("photo") or {}
          photo_checks = photo.get("checks") or {}
          staff = self_test.get("staff") or {}

          cases = {x.get("key"): x for x in (browser.get("browser_cases") or [])}
          sys = browser.get("system_check") or {}
          official = browser.get("official_product_site") or {}
          tech = browser.get("customer_tech_terms") or {}

          subject = (
              f"HOUKAGO R2 FINAL QA {overall} "
              f"[API={api.get('status','FAIL')} BROWSER={browser.get('status','FAIL')}]"
          )

          lines = [
              subject,
              "",
              "PRODUCT=DPRO PRODUCT READY #35 HOUKAGO",
              "AUDIT_SEQUENCE=2",
              f"FRONTEND_VERSION={api.get('frontend_version')}",
              f"PRODUCT_READY_CHECK={check_result.get('passed')}/{check_result.get('total')} all_passed={check_result.get('all_passed')}",
              f"SELF_TEST={self_test.get('ok')}",
              f"STAFF_SELF_TEST={staff.get('ok')}",
              (
                  "DEMO_PREPARE="
                  f"{demo.get('ok')} "
                  f"first={demo_checks.get('first')} "
                  f"second={demo_checks.get('second')} "
                  f"repeat_safe={demo_checks.get('repeat_safe')} "
                  f"production_untouched={demo_checks.get('production_untouched')}"
              ),
              (
                  "PHOTO_PRIVACY="
                  f"{photo.get('ok')} "
                  f"linked={photo_checks.get('guardian_linked_child')} "
                  f"cross_child_denied={photo_checks.get('guardian_cross_child_denied')} "
                  f"cross_tenant_denied={photo_checks.get('cross_tenant_child_denied')} "
                  f"private_bucket={photo_checks.get('private_bucket')} "
                  f"read_expiry={photo_checks.get('signed_read_expiry_seconds')} "
                  f"upload_expiry={photo_checks.get('signed_upload_expiry_seconds')} "
                  f"revoke_blocks_new_signing={photo_checks.get('session_revoke_blocks_new_signing')}"
              ),
              f"PC_1440={cases.get('pc_1440',{}).get('status')} overflow_ok={cases.get('pc_1440',{}).get('horizontal_overflow_ok')}",
              f"MOBILE_390={cases.get('mobile_390',{}).get('status')} overflow_ok={cases.get('mobile_390',{}).get('horizontal_overflow_ok')}",
              f"MOBILE_320={cases.get('mobile_320',{}).get('status')} overflow_ok={cases.get('mobile_320',{}).get('horizontal_overflow_ok')}",
              f"IPAD_1024={cases.get('ipad_1024',{}).get('status')} overflow_ok={cases.get('ipad_1024',{}).get('horizontal_overflow_ok')}",
              f"SUPPORT_PROGRAM={cases.get('support_program',{}).get('status')}",
              f"CUSTOMER_TECH_TERMS={tech.get('status')} hits={len(tech.get('hits') or [])}",
              f"SYSTEM_CHECK={sys.get('status')} auto={sys.get('automatic')} pages={sys.get('pages')} overall={sys.get('overall_title')}",
              (
                  "OFFICIAL_PRODUCT_SITE="
                  f"{official.get('status')} "
                  f"r2_markers={official.get('r2_marker_count')} "
                  f"old_r7_markers={official.get('old_r7_marker_count')} "
                  f"overflow_ok={official.get('horizontal_overflow_ok')}"
              ),
              f"ERROR_COUNT={len(errors)}",
          ]

          if errors:
              lines.append("ERRORS=" + " | ".join(str(x) for x in errors)[:6000])

          pathlib.Path("/tmp/houkago_qa_commit_message.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          pathlib.Path("/tmp/houkago_final_status.txt").write_text(
              overall, encoding="utf-8"
          )

          print("\n".join(lines))
          PY

      - name: Self-remove QA workflow and commit evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm --ignore-unmatch .github/workflows/houkago-r2-final-qa.yml
          git add -A

          if git diff --cached --quiet; then
            echo "No staged repository changes."
          else
            git commit -F /tmp/houkago_qa_commit_message.txt
            git push origin main
          fi

      - name: Final QA gate
        if: always()
        shell: bash
        run: |
          status="$(cat /tmp/houkago_final_status.txt 2>/dev/null || echo FAIL)"
          echo "FINAL_QA_STATUS=$status"
          test "$status" = "PASS"
