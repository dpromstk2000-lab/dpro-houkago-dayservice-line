<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>DPRO 放課後等デイサービス｜ガイドセンター</title><link rel="stylesheet" href="./tutorial.css"></head>
<body><main class="dt-guide"><section class="dt-guide-hero"><small>GUIDE CENTER / R4</small><h1>DPRO 放課後等デイサービス<br>ガイドセンター</h1><p>役割ごとの確認項目を、R2で承認された同じコンテンツIDから整理しています。操作ガイドは業務データの送信・保存・状態変更を自動実行しません。</p><div class="dt-guide-actions"><a class="dt-link primary" href="./tutorial.html?replay=1">操作ガイドを開始・再生</a><a class="dt-link" href="./demo-guide.html?demo=1">公開デモ画面一覧</a></div></section><section class="dt-guide-grid" id="guideGrid"></section><section class="dt-safety"><h2>安全・個人情報の基本</h2><ul id="safetyList"></ul></section></main><script src="./tutorial-content.js"></script><script>
(function(){'use strict';const C=window.DPRO_TUTORIAL_CONTENT,$=s=>document.querySelector(s);const catSteps={guardian:[2,3,4,5],staff_daily:[6,7,8],owner_ops:[9],public_program:[10],safety:[1,2,5,6,7,8,9,10]};const routeByCat={guardian:'member.html?demo=1',staff_daily:'owner-ipad.html?demo=1',owner_ops:'owner.html?demo=1',public_program:'support-program.html?demo=1',safety:'demo-guide.html?demo=1'};const summary={guardian:'保護者連絡と保護者マイページの確認項目です。',staff_daily:'スタッフiPadの児童確認・送迎・活動画面を安全に確認します。',owner_ops:'管理PCの確認場所を案内します。保存や状態変更はTutorialでは実行しません。',public_program:'公開用の5領域支援プログラムを確認します。',safety:'Tutorialの操作境界と個人情報保護の確認項目です。'};$('#guideGrid').innerHTML=C.guide_center.categories.map(cat=>{const nums=catSteps[cat.id]||[];const first=nums[0]||1;return `<article class="dt-guide-card" data-content-id="${cat.id}"><h2>${cat.title}</h2><p style="color:var(--dt-muted);font-size:12px;line-height:1.6">${summary[cat.id]||''}</p><div class="dt-guide-list">${cat.articles.map(a=>`<div class="dt-guide-item"><strong>${a}</strong><span>関連画面：${routeByCat[cat.id]||'操作ガイド'}。実データを教材へ複製せず、説明のみ行います。</span></div>`).join('')}</div><a class="dt-guide-replay" href="./tutorial.html?replay=1&step=${first}">関連するFirst10を再生</a></article>`}).join('');const safe=[C.global_safety.privacy_copy,'送信・保存・承認・公開・アップロード・状態変更などの業務操作をTutorialは自動実行しません。','実在する児童・家族・職員の個人情報やprivate写真をTutorialコンテンツへ複製しません。','内部診断機能はTutorial/Guide Centerの対象外です。'];$('#safetyList').innerHTML=safe.map(x=>`<li>${x}</li>`).join('');})();
</script></body></html>
